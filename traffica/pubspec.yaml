name: traffica
description: A cross-platform intelligent mobility app built with Flutter.
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  dio: ^5.2.1
  fl_chart: ^1.1.1
  animations: ^2.0.9
  provider: ^6.1.0
  adaptive_theme: ^3.1.0
  http: ^1.2.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  location: ^8.0.1
  latlong2: ^0.9.0
  flutter_map: ^8.2.2
  shared_preferences: ^2.3.2
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_messaging: ^16.0.4
  firebase_storage: ^13.0.4
  cloud_firestore: ^6.1.0
  shared_preferences_platform_interface: ^2.4.1
  image_picker: ^0.8.7+4
  flutter_dotenv: ^6.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
    background_color: "#hex_code"
    theme_color: "#hex_code"


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/app_logo.png
    - assets/images/background.png
    - .env

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#0b1220"
  android_12:
    color: "#ffffff"
    color_dark: "#0b1220"
  web: true

